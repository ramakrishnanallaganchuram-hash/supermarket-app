name: Deploy Supermarket App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: "43.204.229.125"
          username: "ubuntu"
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo chown -R ubuntu:ubuntu /home/ubuntu/supermarket
            git config --global --add safe.directory /home/ubuntu/supermarket
            cd /home/ubuntu/supermarket
            git pull origin main
            source /home/ubuntu/supermarket-env/bin/activate
            pip install -r requirements.txt
            pkill -f "python3 app.py" || true
            sleep 2
            nohup /home/ubuntu/supermarket-env/bin/python3 /home/ubuntu/supermarket/app.py > /home/ubuntu/supermarket/app.log 2>&1 &
            disown
            sleep 3
            echo "App deployed successfully!"
